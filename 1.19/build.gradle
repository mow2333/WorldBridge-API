plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = "${mod_version}"
group = 'io.github.mow2333'

base {
    archivesName = "worldbridge-api-${minecraft_version}"
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // API 需要 MC 类做编译期 classpath（仅编译，不产 mod）
    mappings channel: mapping_channel, version: mapping_version
}

repositories {
    maven { url = "https://maven.aliyun.com/repository/public" }
    maven { url = "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/" }
    mavenCentral()
    maven { url = "https://maven.minecraftforge.net/" }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

java {
    withSourcesJar()
    withJavadocJar()
}

// Central requires a javadoc jar. MC classes are only on the compile classpath,
// so relax doclint & ignore unresolved-symbol noise; the jar just needs to exist & be valid.
tasks.named('javadoc', Javadoc).configure {
    options.encoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:none', true)
    failOnError = false
}

// ===== Maven Central Publishing (io.github.mow2333) =====
// Credentials come from ~/.gradle/gradle.properties (outside git):
//   sonatypeUsername / sonatypePassword
// GPG signing via system gpg (useGpgCmd): passphrase prompt pops up via gpg-agent (Kleopatra).

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = "worldbridge-api-${minecraft_version}"
            pom {
                name = 'WorldBridge API'
                description = 'WorldBridge（世界之桥）公开 API：维度/红链/跨维漏斗/地球仪 接口与事件（Minecraft ' + project.minecraft_version + '）'
                url = 'https://github.com/mow2333/WorldBridge-API'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'mow2333'
                        name = 'Mow2333'
                        email = 'samuel202201@163.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/mow2333/WorldBridge-API.git'
                    developerConnection = 'scm:git:ssh://github.com/mow2333/WorldBridge-API.git'
                    url = 'https://github.com/mow2333/WorldBridge-API'
                }
                // Strip any Minecraft/Forge deps leaking from the FG minecraft configuration.
                // The API jar itself declares no runtime deps; consumers compile against their own MC env.
                withXml {
                    def deps = asNode().get('dependencies')
                    if (deps != null) deps.replaceNode({})
                }
            }
        }
    }
    repositories {
        maven {
            name = 'central'
            // Central Publisher Portal OSSRH-compatible staging endpoint (new Portal, not legacy s01)
            url = 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
            credentials {
                username = findProperty('sonatypeUsername')
                password = findProperty('sonatypePassword')
            }
        }
    }
}

signing {
    // Traditional keyring-based signing (no dependence on gpg being on PATH).
    // Credentials come from ~/.gradle/gradle.properties (outside git):
    //   signing.keyId / signing.password / signing.secretKeyRingFile
    sign publishing.publications.mavenJava
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "--add-exports" << "java.base/java.lang=ALL-UNNAMED" << "--add-exports" << "java.base/java.util=ALL-UNNAMED" << "--add-exports" << "java.base/java.lang.invoke=ALL-UNNAMED" << "--add-exports" << "java.base/java.nio.charset=ALL-UNNAMED" << "--add-exports" << "java.base/java.net=ALL-UNNAMED" << "--add-exports" << "java.base/java.util.concurrent.atomic=ALL-UNNAMED" << "--add-exports" << "java.base/java.lang.reflect=ALL-UNNAMED" << "--add-exports" << "java.base/java.io=ALL-UNNAMED" << "--add-exports" << "java.base/java.nio=ALL-UNNAMED" << "--add-exports" << "java.base/java.util.concurrent=ALL-UNNAMED" << "--add-opens" << "java.base/java.lang=ALL-UNNAMED" << "--add-opens" << "java.base/java.util=ALL-UNNAMED" << "--add-opens" << "java.base/java.lang.reflect=ALL-UNNAMED" << "--add-opens" << "java.base/java.io=ALL-UNNAMED" << "--add-opens" << "java.base/java.nio=ALL-UNNAMED" << "--add-opens" << "java.base/java.util.concurrent=ALL-UNNAMED"
}
